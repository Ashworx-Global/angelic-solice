name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Pages deployment skipped
        if: steps.configure.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not configured/enabled for this repository. The Eleventy build succeeded and the artifact was uploaded, but deployment was skipped (private repositories may require an eligible plan). Enable Pages with source 'GitHub Actions' in repository settings when available."
